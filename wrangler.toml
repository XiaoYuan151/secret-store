name = "secret-store"
main = "cloudflare-worker.mjs"
compatibility_date = "2026-10-04"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "secret-store"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
